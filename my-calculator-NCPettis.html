	<head>

    	<meta name="description" content="This is where your description goes">

		<title>My Calculator</title>

		<!-- external CSS link -->
		<link rel="stylesheet" href="my-calculator-NCPettis.css">

	<body>
		<section id="webApp">
        <h1> DO MATHS </h1>

            <li id="plus">+</li>
            <li id="subtract">-</li>
            <li id="divide">/</li>
            <li id="multiply">*</li>
        </ul>
		</section>
		<section id="right">
			<input id="num1" type="text" placeholder="Num 1">
		
			<input id="num2" type="text" placeholder="Num 2">
		</section>
		</section>

        <!-- <button id="calculate" type="button" name="button">Calculate</button> -->
        <h2>EQUALS:</h2>
        <p id="showResult"></p>
